<!doctype html><html lang="zh"><meta charset="utf-8"><title>场次演练页</title>
<body><h1>门店资料</h1><button type="button" id="switch">切换</button>
<div id="card">猪肉 14.8 元</div><pre id="state"></pre>
<script>
let state={scope:"北方门店",card_scope:"北方门店",phase:'loaded',card:{kind:'product_card',id:'product_card-A',revision:'v1',store_id:'store-N',sku:'pork-500g',price_cny:14.8}};
const show=()=>document.querySelector('#state').textContent=JSON.stringify(state);
show();
document.querySelector('#switch').onclick=()=>{
  state.scope="南方门店"; state.phase='pending'; show();
  setTimeout(()=>{state.card_scope=state.scope; state.phase='loaded';state.card={kind:'product_card',id:'product_card-B',revision:'v1',store_id:'store-S',sku:'pork-500g',price_cny:15.1};
    document.querySelector('#card').textContent="猪肉 15.1 元"; show();},300);
};
</script></body></html>
